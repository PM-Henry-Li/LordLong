# /etc/nginx/sites-available/finger.lordlong.cn
# 将证书路径替换为实际 Certbot 或阿里云证书路径。

server {
    listen 80;
    listen [::]:80;
    server_name finger.lordlong.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name finger.lordlong.cn;

    root /var/www/fingerGame;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/finger.lordlong.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finger.lordlong.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "microphone=(), camera=()" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|wav|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
